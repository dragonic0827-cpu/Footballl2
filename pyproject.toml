[project]
name = "football-world"
version = "0.1.0"
description = "Deterministic, continuous international football history simulation core"
requires-python = ">=3.11"

[tool.vercel]
# Keep this at the repository root.  Vercel's framework detector checks the
# conventional root entrypoints before it constructs the Python function.
entrypoint = "app.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
