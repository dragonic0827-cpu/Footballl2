[project]
name = "football-world"
version = "0.1.0"
description = "Deterministic, continuous international football history simulation core"
requires-python = ">=3.11"

[tool.vercel]
# This path is relative to Vercel's configured Root Directory. The Root
# Directory must therefore be the repository root, not `src` or `tests`.
entrypoint = "index.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
